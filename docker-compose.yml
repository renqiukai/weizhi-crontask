services:
  mongo:
    image: mongo:7
    container_name: weizhi-crontask-mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weizhi-crontask
    restart: always
    env_file:
      - .env
    ports:
      - "8800:8800"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
